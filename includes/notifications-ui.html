<!-- Notifications Bell Icon & Popup Component -->
<!-- Include this in your dashboard header/navbar -->

<style>
    .notifications-bell {
        position: relative;
        cursor: pointer;
        font-size: 1.3rem;
        margin-right: 20px;
    }

    .notifications-bell:hover {
        color: #667eea;
        transform: scale(1.1);
        transition: all 0.2s ease;
    }

    .notification-badge {
        position: absolute;
        top: -8px;
        right: -8px;
        background: #ff4757;
        color: white;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: bold;
        border: 2px solid white;
    }

    .notification-badge.hidden {
        display: none;
    }

    .notifications-popup {
        position: absolute;
        top: 50px;
        right: 0;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        width: 380px;
        max-height: 500px;
        overflow-y: auto;
        z-index: 1050;
        display: none;
    }

    .notifications-popup.show {
        display: block;
        animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .notification-header {
        padding: 15px;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 600;
        background: #f8f9fa;
    }

    .notification-item {
        padding: 12px 15px;
        border-bottom: 1px solid #f0f0f0;
        cursor: pointer;
        transition: background 0.2s ease;
    }

    .notification-item:hover {
        background: #f8f9fa;
    }

    .notification-item.unread {
        background: #f0f7ff;
        font-weight: 500;
    }

    .notification-item.unread::before {
        content: '';
        position: absolute;
        left: 0;
        width: 4px;
        height: 100%;
        background: #667eea;
    }

    .notification-item.unread {
        position: relative;
        padding-left: 20px;
    }

    .notification-title {
        font-weight: 600;
        color: #2c3e66;
        margin-bottom: 4px;
        font-size: 0.95rem;
    }

    .notification-message {
        color: #666;
        font-size: 0.85rem;
        margin-bottom: 6px;
        line-height: 1.4;
    }

    .notification-time {
        font-size: 0.75rem;
        color: #999;
    }

    .notification-actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
    }

    .notification-actions button {
        padding: 4px 8px;
        font-size: 0.75rem;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .notification-actions .btn-view {
        background: #667eea;
        color: white;
    }

    .notification-actions .btn-view:hover {
        background: #5568d3;
    }

    .notification-actions .btn-close {
        background: #e0e0e0;
        color: #666;
    }

    .notification-actions .btn-close:hover {
        background: #d0d0d0;
    }

    .notification-empty {
        padding: 30px 15px;
        text-align: center;
        color: #999;
        font-size: 0.9rem;
    }

    .notification-footer {
        padding: 12px 15px;
        text-align: center;
        border-top: 1px solid #e0e0e0;
        font-size: 0.85rem;
    }

    .notification-footer a {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
    }

    .notification-footer a:hover {
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        .notifications-popup {
            width: calc(100vw - 20px);
            right: -50vw;
            max-height: 400px;
        }
    }
</style>

<!-- Bell Icon HTML (add to navbar/header) -->
<div class="notifications-bell" id="notificationsBell" title="Notifications">
    <i class="fas fa-bell"></i>
    <span class="notification-badge hidden" id="notificationBadge">0</span>
</div>

<!-- Notifications Popup (add to navbar/header) -->
<div class="notifications-popup" id="notificationsPopup">
    <div class="notification-header">
        <span>Notifications</span>
        <button style="background: none; border: none; color: #666; cursor: pointer; font-size: 1.2rem;" onclick="closeNotificationsPopup()">&times;</button>
    </div>
    <div id="notificationsContainer">
        <div class="notification-empty">Loading notifications...</div>
    </div>
    <div class="notification-footer">
        <a href="#" onclick="markAllAsRead(); return false;">Mark all as read</a>
    </div>
</div>

<!-- Close popup when clicking outside -->
<script>
document.addEventListener('click', (e) => {
    const popup = document.getElementById('notificationsPopup');
    const bell = document.getElementById('notificationsBell');
    if (!popup.contains(e.target) && !bell.contains(e.target)) {
        closeNotificationsPopup();
    }
});

function closeNotificationsPopup() {
    document.getElementById('notificationsPopup').classList.remove('show');
}

function toggleNotificationsPopup() {
    const popup = document.getElementById('notificationsPopup');
    popup.classList.toggle('show');
}

// Load notifications on page load
document.getElementById('notificationsBell').addEventListener('click', () => {
    toggleNotificationsPopup();
    if (document.getElementById('notificationsPopup').classList.contains('show')) {
        loadNotifications();
    }
});

function loadNotifications() {
    fetch('../api/get-notifications.php')
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                updateNotificationBadge(data.unread_count);
                displayNotifications(data.notifications);
            }
        })
        .catch(err => console.error('Error loading notifications:', err));
}

function updateNotificationBadge(count) {
    const badge = document.getElementById('notificationBadge');
    if (count > 0) {
        badge.textContent = count > 9 ? '9+' : count;
        badge.classList.remove('hidden');
    } else {
        badge.classList.add('hidden');
    }
}

function displayNotifications(notifications) {
    const container = document.getElementById('notificationsContainer');
    
    if (notifications.length === 0) {
        container.innerHTML = '<div class="notification-empty"><i class="fas fa-check-circle me-2"></i>All caught up! No new notifications.</div>';
        return;
    }

    let html = '';
    notifications.forEach(notif => {
        const isUnread = notif.is_read == 0;
        const createdDate = new Date(notif.created_at);
        const now = new Date();
        const diffMs = now - createdDate;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);
        const diffDays = Math.floor(diffMs / 86400000);
        
        let timeStr = '';
        if (diffMins < 1) timeStr = 'Just now';
        else if (diffMins < 60) timeStr = `${diffMins}m ago`;
        else if (diffHours < 24) timeStr = `${diffHours}h ago`;
        else if (diffDays < 7) timeStr = `${diffDays}d ago`;
        else timeStr = createdDate.toLocaleDateString();

        html += `
            <div class="notification-item ${isUnread ? 'unread' : ''}">
                <div class="notification-title">${escapeHtml(notif.title)}</div>
                <div class="notification-message">${escapeHtml(notif.message || '')}</div>
                <div class="notification-time">${timeStr}</div>
                <div class="notification-actions">
                    ${notif.action_url ? `<button class="btn-view" onclick="goToAction('${escapeHtml(notif.action_url)}')"><i class="fas fa-arrow-right me-1"></i>View</button>` : ''}
                    <button class="btn-close" onclick="deleteNotification(${notif.id})"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        `;
    });

    container.innerHTML = html;
}

function deleteNotification(notifId) {
    if (confirm('Delete this notification?')) {
        fetch('../api/delete-notification.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ notification_id: notifId })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                loadNotifications();
            }
        });
    }
}

function goToAction(url) {
    closeNotificationsPopup();
    window.location.href = url;
}

function markAllAsRead() {
    const unreadNotifs = document.querySelectorAll('.notification-item.unread');
    unreadNotifs.forEach(notif => {
        const notifId = notif.querySelector('.btn-close').getAttribute('onclick').match(/\d+/)[0];
        fetch('../api/mark-notification-read.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ notification_id: notifId })
        });
    });
    setTimeout(() => loadNotifications(), 500);
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Auto-refresh notifications every 30 seconds
setInterval(loadNotifications, 30000);

// Initial load
loadNotifications();
</script>
